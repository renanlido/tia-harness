description = "Prepare a human-approval envelope for a GATED operation (download/online/scan/secret/safety). NEVER performs the gated action (class GATE)."

prompt = """
You are running the `tia-handoff` workflow (port of the Claude Code skill of the same name).

GOAL: The harness is an ASSISTANT UP TO THE GATE, never an autonomous commissioner. Anything that
touches the physical controller, the network, secrets, or safety STOPS here. This workflow assembles
the approval envelope (`requires_human_action`) — what CAN be done, what the human MUST do, the plan
+ hash, and the exact resume call — and then STOPS. It is **class GATE**: it NEVER performs the gated
action. The AI never approves, never invents a secret, never deploys F autonomously.

ERRORS AND REPORTING:
- First call `tia_ping`: continue only if it reports `reachable:true` and `activated:true`. `activated:null` with a busy `detail` means a job is still running: poll `tia_job_status` with the `jobId` you hold, or wait and ping again. Otherwise stop, quote its `detail` and `hint` verbatim and say that nothing was changed (prerequisites: `tia_guide {"topic":"gotchas"}`).
- If no `tia_*` tool is available, the `tia` MCP is not connected: say so and stop. Never continue from memory and never work around it with hand-made HTTP calls (they bypass the MCP's gate checks).
- On a tool error (`isError:true`), quote its `error` and `kind` verbatim, relay its `hint`, and state what was done and what was not. Apply only the remedy the hint or this skill names, at most once; otherwise stop and ask.
- Never report success after an error, never retry a refused call with changed arguments, and never cross a human gate: relay a `requires_human_action` answer verbatim and wait for the human.
- `status:"running"` or `kind:"busy"` is not a failure: poll `tia_job_status {jobId}`. After a `timeout`, check the state before repeating anything.

INPUT (what the user wants to deploy / do — e.g. "download to PLC_1", "go online", "scan network"):
{{args}}

THE GATES (and the tool that fronts each):
- **G1** open/connect project (1st time) — `tia_connect` (+ `tia_show_ui`) — human confirms the TIA
  trust dialog on the serve host.
- **G3** DOWNLOAD (CPU STOP -> overwrite -> restart) — `tia_download` — human approves the verified
  plan + software fingerprint: StopAll, OverwriteSystemData, StartModule, and (opt-in)
  UpgradeTargetDevice.
- **G4** go online (connect to live CPU) — `tia_online` — human confirms it is safe to connect to
  the target machine.
- **G4** station upload (read CPU into project) — `tia_upload` — human confirms it is safe to
  connect to the target machine AND the open project is a dedicated backup project (the upload
  adds a new station — workflow `tia-backup`).
- **G7** network scan (accessible devices) — `tia_accessible_devices` — human approves probing the
  local network via the PG/PC NIC.
- **G6** credentials — master secret / UMAC (`tia_mastersecret_set` (`{plc, password}`), `tia_mastersecret_reset`, `tia_connect`
  `umacUser`/`umacPassword`), upload read password (`tia_upload` `password`), block know-how password (`tia_block_protect`),
  certificate password (`tia_certificate_import`), password policy (`tia_password_policy_set`), local-session logon dialog
  (`tia_local_session_open`: a UMAC-protected session may wait on a Siemens logon dialog on the serve host) — human SUPPLIES the
  secret / DECIDES the policy / ANSWERS the logon dialog; a reset only on the human's explicit request.
- **G5** safety / F author-modify-download — NO tool; NEVER autonomous; F deploy is a human, gated
  action.

(Note: the table above is APPROVAL gates — a human approves an ACTION. There is a second class:
GUI-CONFIG gates — a human CLICKS a setting TIA does not expose via Openness (OPC UA runtime
license / server interface, PUT/GET, the first-connect trust dialog). Those surface during
scaffold/verify — e.g. a compile error "OPC UA license is not sufficient" is a GATE, not a bug.
Don't retry them blindly; the exact GUI steps are in `tia_guide {"topic":"gui-gates"}` (the harness
guide's "Human interaction points (GUI gates)").)

PROCEDURE (in order):
1. **Precondition (Gd9).** Confirm the latest `tia_compile` is CLEAN (`errors:0`) via the tia-verify
   workflow. Never prepare a download for an inconsistent project.
2. **Discover the path (no gate, no scan).** Connection mode / PG-PC interface / target interface are
   localized names — discover them with **`tia_pg_interfaces`** (reads what TIA already knows about
   the CPU's `DownloadProvider`, plus each adapter's OS status; NO network scan). Only reach for
   `tia_accessible_devices` (GATE G7, a real scan) when `tia_pg_interfaces` doesn't resolve the
   interface you need.
3. **Dry-run the download.** `tia_download { dryRun:true }` asks serve for a **verified plan**: a
   fresh compile, the connection resolved, and the **software fingerprint** (content hash of
   blocks/UDTs/tag tables — NOT hardware, system block groups or technology objects; falls back to
   modification dates when a block has no fingerprint provider). Only a `ready` plan returns a
   **`planHash`** — a single-use token that EXPIRES (`TIA_PLAN_TTL_MS`, default 15 min) and lives
   only in this MCP process. NOTHING is sent to the CPU.
4. **Emit the handoff envelope** (`requires_human_action`):
   - `canDo` — e.g. "download to PLC_1".
   - `youMustDo` — the concrete physical consequence (the CPU will STOP, system data is overwritten,
     the CPU restarts) + confirm it is safe on the target line.
   - `plan` + `planHash` + `fingerprint` — show the human BOTH: the hash binds the approval to this
     exact plan AND this exact software content — NOT the hardware configuration. Re-plan (new dryRun)
     + fresh human approval only if the hardware configuration changed AFTER the dryRun that produced
     the token — the fingerprint cannot detect that change, so confirm with the human that nothing
     hardware-side moved; never reuse the old token for changed hardware.
   - `resume` — the precise call a human runs after approving: `tia_download { approved:true,
     planHash:"<the hash>", ... }` (the SAME parameters as the dry-run).
5. **STOP.** Do NOT call `tia_download` with `approved:true` yourself. A human approves out-of-band
   and runs the resume call (or explicitly instructs you to, with the hash).
6. **On `approved:true`,** serve re-checks the fingerprint INSIDE the download call (no window
   between check and load) and answers `409 plan_stale` if the software changed since the plan —
   start over with a new dry-run and a new approval. `allowUpgradeTargetDevice:true` (TIA's "upgrade
   the target device" confirmation, #31) is part of the approved plan; never add it without the
   human's yes — without it, a CPU that requires it refuses the load with `409
   upgrade_target_device_required` (check the CPU state before retrying: earlier confirmations in the
   same pass, like StopAll, cannot be undone).
7. **The other gates.** G4 go-online and G7 scan: call `tia_online` / `tia_accessible_devices` once
   WITHOUT `confirm` — it returns the `requires_human_action` handoff and touches nothing; relay it
   verbatim and STOP. Only after the human's explicit yes, repeat the same call with
   `confirm:true` (there is no token: the human's yes is the approval). G6: `tia_mastersecret_set`
   and the `umac*` fields of `tia_connect` take only a secret the human typed; so do the passwords of
   `tia_block_protect` and `tia_certificate_import`, and `tia_password_policy_set` takes only values
   the human decided. A station upload (G4)
   is the tia-backup workflow.

CONFIRMATION DIALOG (when the client supports it):
A client that supports elicitation shows its own confirmation dialog before a gated call goes through:
`tia_download` with `approved:true`, and `tia_upload`, `tia_online` and `tia_accessible_devices` with
`confirm:true`. A client without it behaves as before.
- Only the human answers it. Never answer, dismiss or work around the dialog yourself.
- It NEVER replaces the flow above. dryRun -> human approval -> the flag with the `planHash` still
  applies in full: the dialog only checks the human's answer, and serve's approval token stays the
  authority. Passwords (G6) are never asked there.
- A refusal stops the call. `declined_by_human` / `cancelled_by_human` (a result, not an error) means
  the human refused: NOTHING was sent and the plan stays valid until its TTL (the token was not
  consumed). STOP; do not retry unless the human asks you to.
- `elicitation_failed` (`isError:true`) means the dialog could not be shown or answered: nothing was
  sent. Relay it and STOP.

TOKEN FAILURE MODES (`reasonCode` on a `download_approval` handoff):
A successful dry-run is NOT a handoff — it returns `status:"plan_ok"` with the `planHash`.
`reasonCode:"not_approved"` appears only when calling the real download without `approved:true`.
- `not_approved` — called without `approved:true` (no token presented) — re-run the dry-run, get human approval, call with `approved:true` + the `planHash`.
- `unknown` — this `planHash` was not issued by this MCP process (or it restarted) — get a fresh dry-run.
- `expired` — the token's TTL passed — get a fresh dry-run.
- `consumed` — this token was already used (single-use) — check the CPU / `tia_job_status` first.
- `plan_mismatch` — the parameters differ from the approved plan — re-review with the ACTUAL parameters.
- `outcome_unknown` — the download call itself failed AFTER the token was consumed (network/timeout/
  serve error) — the token is SPENT and cannot be reused: check the CPU state directly and
  `tia_status`/`tia_job_status` BEFORE requesting a new plan; do NOT retry the same call.
`serve_too_old` is NOT a `reasonCode`: a serve without `POST /plcs/{plc}/download/plan` (< app v1.6.0)
fails the dry-run with an ordinary `isError:true` result with `kind:"serve_too_old"` — update the app,
never fall back to the unverified path.

HARD GUARANTEES:
- Never auto-approve / auto-deploy. This workflow outputs a plan + resume instructions; it does not
  perform the gated action. `approved:true` + a matching `planHash` only ever come from an explicit
  human decision.
- Secrets are human-supplied (G6). Master secret, UMAC and the upload / block / certificate passwords
  come from a human or a credential vault — NEVER invented by the AI, never logged, never put in
  config. Password-policy values (`tia_password_policy_set`) are the site's security decision: the
  human decides them, the AI never picks them.
- Safety never autonomous (G5). F-program author/modify/download is always a gated, human action.
  The harness only reports F (signatures); the safety-reviewer is read-only.
- Plan binding. The download executes only with the EXACT `planHash` from the dry-run — a changed
  plan invalidates the approval (re-review). serve re-verifies the fingerprint again inside the real
  download — the token is never trusted blindly.

See `../GEMINI.md` for the gates/guards, the GUI-config gates, and the tool map.
"""
